# Publishes to PyPI on a GitHub Release, via Trusted Publishing (OIDC) - no
# stored token. One-time setup: add this repo as a Trusted Publisher on PyPI
# (project readonly-sql-guard, workflow publish.yml, environment pypi).
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v5.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m ruff check readonly_sql_guard tests
      - run: python -m pytest -q
      - name: The release tag must match __version__
        run: |
          python - <<'PY'
          import os, re, pathlib, sys
          tag = os.environ["TAG"].lstrip("v")
          src = pathlib.Path("readonly_sql_guard/__init__.py").read_text(encoding="utf-8")
          ver = re.search(r'__version__ = "([^"]+)"', src).group(1)
          if tag != ver:
              sys.exit(f"release tag {tag!r} != __version__ {ver!r}")
          print("tag and __version__ agree:", ver)
          PY
        env:
          TAG: ${{ github.event.release.tag_name }}

  publish:
    needs: [test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write            # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v5.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check the artifacts
        run: |
          python -m pip install twine
          python -m twine check dist/*
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
