# Keep the SHA-pinned actions and the sqlglot dependency current without anyone
# remembering to look. A pin nobody updates ages into a known-vulnerable version.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
